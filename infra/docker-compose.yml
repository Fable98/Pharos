services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: pharos
      POSTGRES_PASSWORD: pharos
      POSTGRES_DB: pharos
    ports: [ "5433:5432" ]
    volumes: [ "pgdata:/var/lib/postgresql/data" ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U pharos -d pharos" ]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: [ "6379:6379" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata: {}
